<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<div th:fragment="main_chat(messageForm, roomId)"
     th:with="mf=${messageForm}, rid=${roomId}"> 
  <div class="chat-header">
    <div class="left-header">
      <div class="chat-main">
        hogefuga
      </div>
    </div>
    <div class="right-header">
      <div class="chat-end">
        <a href="#">チャットを終了する</a>
      </div>
    </div>
  </div>

  <div class="messages">
    <div class="message">
      <div class="up-message">
        <div class="message-user">
          Tom
        </div>
        <div class="message-date">
          2020/3/31(Wed) 12:43:40
        </div>
      </div>
      <div class="down-message">
        <div class="message-content">
          おはよう
        </div>
      </div>
    </div>

    <div class="message">
      <div class="up-message">
        <div class="message-user">
          Tom
        </div>
        <div class="message-date">
          2020/3/31(Wed) 12:47:30
        </div>
      </div>
      <div class="down-message">
        <div class="message-content">
          こんばんは
        </div>
      </div>
    </div>
  </div>
  <form th:action="@{/rooms/{roomId}/messages(roomId=${roomId})}" method="post" th:object="${mf}" class="form">
      <div class="form-input">
        <input th:field="*{content}" class="form-message" placeholder= "type a message">
        <label class="form-image">
          <span class="image-file">画像</span>
          <input type="file" class="hidden">
        </label>
      </div>  
      <input class="form-submit" type="submit" value="送信">
  </form>
</div>
</html>
